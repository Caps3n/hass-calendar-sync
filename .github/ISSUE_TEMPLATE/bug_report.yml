name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Calendar provider
      options:
        - Apple iCloud
        - Google Calendar
        - Other CalDAV server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Calendar Sync version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → System → Logs, filtered for "calendar_sync". Remove passwords and e-mail addresses.
      render: text
